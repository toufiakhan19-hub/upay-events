# Fallback host for the AI service if Vercel Services is unavailable.
# Point the web app's AI_SERVICE_URL at the resulting Render URL.
services:
  - type: web
    name: upayevents-ai
    runtime: python
    rootDir: ai
    buildCommand: pip install -r requirements.txt uvicorn
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
